# Full stack: API + Caddy + OTel observability backends.
# Production-equivalent. Caddy handles TLS in production (needs ZAAS_DOMAIN set).
# For local dev, use with docker-compose.local.yml overlay.
# Use linux/amd64 images.
#
# Usage (production):
#   docker compose -f deploy/docker-compose.yml up -d
#
# Usage (local dev via Makefile):
#   make dev
#   (runs: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up)

services:
  # ── Application ────────────────────────────────────────────────────────────

  api:
    # In production, set ZAAS_API_IMAGE to the immutable digest output by the deploy workflow
    # (e.g. ghcr.io/haraig/zaas/api@sha256:<digest>). The :latest fallback is for local dev only.
    image: ${ZAAS_API_IMAGE:-ghcr.io/haraig/zaas/api:latest}
    restart: unless-stopped
    environment:
      ZAAS_PORT: "8080"
      ZAAS_BASE_URL: "${ZAAS_BASE_URL:-http://localhost}"
      ZAAS_LOG_LEVEL: "${ZAAS_LOG_LEVEL:-info}"
      ZAAS_LOG_FORMAT: "${ZAAS_LOG_FORMAT:-json}"
      ZAAS_CORS_ORIGINS: "${ZAAS_CORS_ORIGINS:-*}"
      ZAAS_RATE_LIMIT_RPM: "${ZAAS_RATE_LIMIT_RPM:-60}"
      ZAAS_OTEL_ENABLED: "${ZAAS_OTEL_ENABLED:-true}"
      ZAAS_METRICS_ENDPOINT_ENABLED: "${ZAAS_METRICS_ENDPOINT_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "zaas-api"
      ZAAS_DB_URL: "${ZAAS_DB_URL:-postgres://zaas:zaas@postgres:5432/zaas?sslmode=disable}"
      ZAAS_RATE_LIMIT_BACKEND: "${ZAAS_RATE_LIMIT_BACKEND:-memory}"
      ZAAS_REDIS_URL: "${ZAAS_REDIS_URL:-redis://redis:6379}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  caddy:
    # In production, set ZAAS_WEB_IMAGE to the immutable digest output by the deploy workflow
    # (e.g. ghcr.io/haraig/zaas/web@sha256:<digest>). The :latest fallback is for local dev only.
    image: ${ZAAS_WEB_IMAGE:-ghcr.io/haraig/zaas/web:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ZAAS_DOMAIN: "${ZAAS_DOMAIN:-zaas.at}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "caddy"
    depends_on:
      - api
      - grafana
      - otel-collector

  webhook:
    build:
      context: ./webhook
    image: zaas-webhook:local
    restart: unless-stopped
    init: true
    environment:
      DEPLOY_WEBHOOK_SECRET: "${DEPLOY_WEBHOOK_SECRET}"
    volumes:
      - ./webhook/hooks.json:/etc/webhook/hooks.json:ro
      - ./webhook/redeploy.sh:/scripts/redeploy.sh:ro
      - /opt/zaas:/opt/zaas
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "-hooks=/etc/webhook/hooks.json",
        "-verbose",
        "-template",
        "-port=9000",
      ]
    depends_on:
      - caddy

  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Generate one with: openssl rand -base64 24}"
      POSTGRES_DB: zaas
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://zaas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Generate one with: openssl rand -base64 24}@postgres:5432/zaas?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-exporter:
    image: oliver006/redis_exporter:v1.87.0@sha256:9ca6f929a8abc518d78158757922444f1cf807661a2238f44b28c3cd08a1b652
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ── OTel Observability Stack ───────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    restart: unless-stopped
    # Needs root (UID 0) to read /var/lib/docker/containers (owned by root, mode 700).
    user: "0"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # Ports 4317/4318 are NOT published in production.
    # Use docker-compose.local.yaml override to expose them for local OTLP testing.
    depends_on:
      - tempo
      - prometheus
      - loki

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # Loopback only. Grafana reaches Tempo over the compose network by service
    # name, so publishing exists purely for host-side debugging. Binding to
    # 0.0.0.0 would expose it to the internet: Docker's published ports are
    # DNAT'd into FORWARD and never traverse the INPUT chain where ufw's rules
    # live, so ufw does not filter them. Reach these from a workstation with an
    # SSH tunnel - see docs/reference/runbook.md.
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP API
      - "127.0.0.1:9095:9095" # Tempo gRPC (used by Grafana Drilldown)
    command: ["-config.file=/etc/tempo/tempo.yaml"]

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yaml:/etc/prometheus/prometheus.rules.yaml:ro
      - prometheus_data:/prometheus
    # Loopback only - see the note on the tempo service.
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:13.0.4@sha256:fc6c7447962d7523090407b94da705fdb6e7ac855c9c4f0293d91a87785a77b0
    restart: unless-stopped
    # Loopback only. Grafana is served publicly at https://grafana.<domain>
    # through Caddy, with TLS and security headers. Publishing 3000 on 0.0.0.0
    # would additionally offer the login form over plaintext HTTP, bypassing
    # all of that. This binding is a break-glass path over an SSH tunnel.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Anonymous access disabled in production.
      # Use GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD env vars (set in .env).
      # docker-compose.local.yml overrides these for local dev (re-enables anonymous access).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/zaas-overview.json"
    depends_on:
      - prometheus
      - tempo
      - loki

  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    restart: unless-stopped
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    # Loopback only. Loki runs with auth_enabled: false, so anyone who can reach
    # this port can query the application logs. See the note on the tempo service.
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      # Slack webhook URL. Alertmanager does not expand env vars in its config,
      # so the secret has to arrive as a file (see slack_api_url_file). Created
      # by hand on the server, gitignored, never committed.
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    # Loopback only, and the most important of these bindings: the Alertmanager
    # API takes unauthenticated writes. Anyone who can reach this port can
    # silence every alert, and can POST an arbitrary alert that Alertmanager
    # will then deliver to Slack looking like a genuine one.
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"
      - "--storage.path=/alertmanager"
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:
