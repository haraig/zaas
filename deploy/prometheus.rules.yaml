# Prometheus alerting rules for ZaaS.
# Loaded by prometheus.yaml via rule_files.
# Every rule carries severity and runbook_url labels.
# runbook_url points at the corresponding playbook section in docs/reference/runbook.md
# on GitHub. The runbook is not served by the website, so the anchors must match
# the ones GitHub generates from the headings: lowercase, punctuation stripped
# (## ZaasApiDown -> #zaasapidown). scripts/check-doc-links.py verifies this.

groups:
  - name: zaas.api
    rules:
      # ── API availability ───────────────────────────────────────────────────

      - alert: ZaasApiDown
        expr: up{job="zaas-api"} == 0
        for: 2m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasapidown
        annotations:
          summary: "ZaaS API is down"
          description: "The zaas-api scrape target has been unreachable for more than 2 minutes."

      # ── Error rate ─────────────────────────────────────────────────────────

      - alert: ZaasHighErrorRate
        expr: >
          sum(rate(http_server_request_duration_seconds_count{job="zaas-api",http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="zaas-api"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaashigherrorrate
        annotations:
          summary: "ZaaS API 5xx error rate above 5%"
          description: "5xx responses account for {{ $value | humanizePercentage }} of traffic over the last 5 minutes."

      # ── Latency ────────────────────────────────────────────────────────────

      - alert: ZaasHighP99Latency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket{job="zaas-api"}[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaashighp99latency
        annotations:
          summary: "ZaaS API p99 latency above 1 second"
          description: "99th-percentile response time is {{ $value | humanizeDuration }} over the last 5 minutes."

      # ── Rate limiting ──────────────────────────────────────────────────────

      - alert: ZaasHighRateLimitRate
        expr: >
          sum(rate(http_server_request_duration_seconds_count{job="zaas-api",http_response_status_code="429"}[5m]))
          > 10
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaashighratelimitrate
        annotations:
          summary: "ZaaS API rate-limit rejections above 10/s"
          description: "The API is returning 429 Too Many Requests at {{ $value | humanize }} req/s - possible abuse or misconfiguration."

  - name: zaas.infrastructure
    rules:
      # ── Disk space ────────────────────────────────────────────────────────

      - alert: ZaasDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"})
          < 0.10
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasdiskspacelow
        annotations:
          summary: "Disk space below 10% on {{ $labels.instance }}"
          description: "Available disk is {{ $value | humanizePercentage }} on mountpoint {{ $labels.mountpoint }}."

      - alert: ZaasDiskSpaceCritical
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"})
          < 0.05
        for: 2m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasdiskspacelow
        annotations:
          summary: "Disk space critically low (< 5%) on {{ $labels.instance }}"
          description: "Available disk is {{ $value | humanizePercentage }} on mountpoint {{ $labels.mountpoint }}. Immediate action required."

      # ── PostgreSQL ─────────────────────────────────────────────────────────

      - alert: ZaasPostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaaspostgresdown
        annotations:
          summary: "ZaaS PostgreSQL exporter is down"
          description: "The postgres-exporter scrape target has been unreachable for more than 2 minutes. PostgreSQL may be down."

      # ── Redis ─────────────────────────────────────────────────────────────

      - alert: ZaasRedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasredisdown
        annotations:
          summary: "ZaaS Redis exporter is down"
          description: "The redis-exporter scrape target has been unreachable for more than 2 minutes. Redis may be down."

      # ── Node Exporter ─────────────────────────────────────────────────────

      # node_exporter is a host systemd service, not a compose service, so a
      # redeploy never restarts it and nothing else notices it is gone. While it
      # is down the disk-space alerts above evaluate to no data and stay silent,
      # and the backup metrics disappear - ZaasBackupMetricsMissing then fires an
      # hour later as a misleading proxy for this.
      - alert: ZaasNodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasnodeexporterdown
        annotations:
          summary: "Node Exporter is down"
          description: "The node-exporter scrape target has been unreachable for 2 minutes. Host metrics are gone and the disk-space alerts are blind. Check systemctl status node_exporter and the UFW rule for port 9100."

  - name: zaas.collector
    rules:
      # ── OTel Collector data loss ───────────────────────────────────────────

      - alert: ZaasCollectorDroppedSpans
        expr: >
          rate(otelcol_exporter_send_failed_spans_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaascollectordroppeddata
        annotations:
          summary: "OTel Collector is dropping spans"
          description: "The Collector is failing to export {{ $value | humanize }} spans/s. Check Tempo connectivity and Collector logs."

      - alert: ZaasCollectorDroppedMetrics
        expr: >
          rate(otelcol_exporter_send_failed_metric_points_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaascollectordroppeddata
        annotations:
          summary: "OTel Collector is dropping metric points"
          description: "The Collector is failing to export {{ $value | humanize }} metric points/s. Check Prometheus remote-write connectivity."

      - alert: ZaasCollectorDroppedLogs
        expr: >
          rate(otelcol_exporter_send_failed_log_records_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaascollectordroppeddata
        annotations:
          summary: "OTel Collector is dropping log records"
          description: "The Collector is failing to export {{ $value | humanize }} log records/s. Check Loki connectivity."

      - alert: ZaasCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaascollectordroppeddata
        annotations:
          summary: "OTel Collector is down"
          description: "The otel-collector scrape target has been unreachable for 2 minutes. All telemetry is being lost."

  - name: zaas.backup
    rules:
      # ── Backups ────────────────────────────────────────────────────────────
      # Fed by deploy/scripts/backup-metrics.sh through the node_exporter
      # textfile collector. backup="postgres" is the daily pg_dump, and
      # backup="volumes" the daily Docker volume archives.

      - alert: ZaasBackupFailed
        expr: zaas_backup_last_run_success == 0
        for: 5m
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasbackupstale
        annotations:
          summary: "ZaaS {{ $labels.backup }} backup run failed"
          description: "The last {{ $labels.backup }} backup exited non-zero. The previous successful backup is still on disk - check journalctl -u zaas-backup.service -u zaas-backup-volumes.service."

      - alert: ZaasBackupStale
        expr: >
          time() - zaas_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasbackupstale
        annotations:
          summary: "ZaaS {{ $labels.backup }} backup has not succeeded in over 26h"
          description: "The last successful {{ $labels.backup }} backup was {{ $value | humanizeDuration }} ago. The daily timers run at 03:00 (postgres) and 03:30 (volumes)."

      # A staleness rule on a series that was never created produces no data and
      # never fires, so the absence of the metric needs its own alert.
      - alert: ZaasBackupMetricsMissing
        expr: >
          absent(zaas_backup_last_success_timestamp_seconds{backup="postgres"})
          or absent(zaas_backup_last_success_timestamp_seconds{backup="volumes"})
        for: 1h
        labels:
          severity: warning
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaasbackupstale
        annotations:
          summary: "ZaaS {{ $labels.backup }} backup metrics are missing"
          description: "No zaas_backup_last_success_timestamp_seconds series for {{ $labels.backup }}. The backup may never have succeeded, or the node_exporter textfile collector is misconfigured - check node_textfile_scrape_error."

  - name: zaas.watchdog
    rules:
      # ── Delivery heartbeat ─────────────────────────────────────────────────

      # Always firing, by design. Its job is to prove the whole path from
      # Prometheus through Alertmanager to Slack still works: a missing or wrong
      # slack_api_url_file does not stop Alertmanager starting and logs nothing,
      # so without a heartbeat, silence is indistinguishable from health.
      # Routed to its own quiet receiver via severity=none (deploy/alertmanager.yaml).
      - alert: ZaasWatchdog
        expr: vector(1)
        labels:
          severity: none
          runbook_url: https://github.com/haraig/zaas/blob/main/docs/reference/runbook.md#zaaswatchdog
        annotations:
          summary: "ZaaS alerting pipeline is alive"
          description: "This alert always fires. If it stops arriving in Slack, alert delivery is broken - not the service."
