# Local development overlay for docker-compose.yml.
# Override with:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up
# Or simply:
#   make dev
#
# Changes from production baseline:
#   - api: live source mount + CompileDaemon hot-reload
#   - web: Astro dev server with hot-reload (port 4321)
#   - caddy: uses Caddyfile.local (HTTP only, proxies to web:4321)
#   - grafana: re-enables anonymous access (overrides production auth settings)
#   - OTel stack: unchanged (same images as production)

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder # Reuse builder stage - CompileDaemon runs inside
    image: zaas-api:dev
    volumes:
      - ../api:/app:cached # Mount Go source for hot-reload
    environment:
      ZAAS_LOG_FORMAT: "text" # Human-readable logs in dev
      ZAAS_LOG_LEVEL: "${ZAAS_LOG_LEVEL:-debug}"
      ZAAS_OTEL_ENABLED: "${ZAAS_OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "zaas-api"
      ZAAS_SMTP_HOST: "mailpit"
      ZAAS_SMTP_PORT: "1025"
      ZAAS_ADMIN_TOKEN: "local-dev-admin-token"
    depends_on:
      - mailpit
    # CompileDaemon watches Go files and re-runs the server on changes.
    command: >
      sh -c "go install github.com/githubnemo/CompileDaemon@latest &&
             CompileDaemon -polling -build='go build -o /tmp/zaas-api ./cmd/server' -command='/tmp/zaas-api'"

  web:
    image: node:26-alpine
    working_dir: /app
    # Run as the host user so Vite's node_modules/.vite cache is not
    # created as root. Without this, `astro check` and `npm run build`
    # fail locally with EACCES when Vite tries to rewrite its dep cache.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../web:/app:cached # Mount Astro source for hot-reload
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_API_BASE_URL: "http://localhost"
      PUBLIC_IMPRINT_NAME: "${PUBLIC_IMPRINT_NAME:-ZaaS Local Dev}"
      PUBLIC_IMPRINT_ADDRESS: "${PUBLIC_IMPRINT_ADDRESS:-Local Development Address}"
      PUBLIC_IMPRINT_EMAIL: "${PUBLIC_IMPRINT_EMAIL:-dev@example.com}"
    ports:
      - "4321:4321" # Exposed for direct browser access if needed
    command: sh -c "npm install && rm -f .astro/dev.json && npm run dev -- --host 0.0.0.0"

  caddy:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
        PUBLIC_IMPRINT_NAME: "${PUBLIC_IMPRINT_NAME:-ZaaS Local Dev}"
        PUBLIC_IMPRINT_ADDRESS: "${PUBLIC_IMPRINT_ADDRESS:-Local Development Address}"
        PUBLIC_IMPRINT_EMAIL: "${PUBLIC_IMPRINT_EMAIL:-dev@example.com}"
    image: zaas-web:local
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro # Override: HTTP only
    depends_on:
      - web
      - grafana

  # Re-enable anonymous access locally (production docker-compose.yml disables it).
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Expose OTel collector ports for direct OTLP testing in local dev.
  # Not published in production (see docker-compose.yaml).
  otel-collector:
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
