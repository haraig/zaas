# Minimal dev stack: API + web + Caddy only.
# Standalone compose file - does NOT overlay docker-compose.yaml or docker-compose.local.yaml.
# Disables all monitoring, database, and Redis - only runs the application services.
#
# Usage:
#   make dev-minimal
#   (runs: docker compose -f deploy/docker-compose.minimal.yaml up)
#
# Trade-offs vs full stack (make dev):
#   - Auth/API key endpoints are disabled (no database)
#   - Rate limiting uses in-memory backend (no Redis)
#   - No traces, metrics, or logs shipped to backends
#   - No Grafana dashboard available
#   - All randomness endpoints work normally

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder
    image: zaas-api:dev
    restart: unless-stopped
    volumes:
      - ../api:/app:cached
    environment:
      ZAAS_PORT: "8080"
      ZAAS_BASE_URL: "${ZAAS_BASE_URL:-http://localhost}"
      ZAAS_LOG_LEVEL: "${ZAAS_LOG_LEVEL:-debug}"
      ZAAS_LOG_FORMAT: "text"
      ZAAS_CORS_ORIGINS: "${ZAAS_CORS_ORIGINS:-*}"
      ZAAS_RATE_LIMIT_RPM: "${ZAAS_RATE_LIMIT_RPM:-60}"
      ZAAS_RATE_LIMIT_BACKEND: "memory"
      ZAAS_OTEL_ENABLED: "false"
      ZAAS_METRICS_ENDPOINT_ENABLED: "${ZAAS_METRICS_ENDPOINT_ENABLED:-true}"
      ZAAS_DB_URL: ""
      ZAAS_ADMIN_TOKEN: "local-dev-admin-token"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: >
      sh -c "go install github.com/githubnemo/CompileDaemon@latest &&
             CompileDaemon -polling -build='go build -o /tmp/zaas-api ./cmd/server' -command='/tmp/zaas-api'"

  web:
    image: node:26-alpine
    working_dir: /app
    # Run as the host user so Vite's node_modules/.vite cache is not
    # created as root. Without this, `astro check` and `npm run build`
    # fail locally with EACCES when Vite tries to rewrite its dep cache.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../web:/app:cached # Mount Astro source for hot-reload
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_API_BASE_URL: "http://localhost"
      PUBLIC_IMPRINT_NAME: "${PUBLIC_IMPRINT_NAME:-ZaaS Local Dev}"
      PUBLIC_IMPRINT_ADDRESS: "${PUBLIC_IMPRINT_ADDRESS:-Local Development Address}"
      PUBLIC_IMPRINT_EMAIL: "${PUBLIC_IMPRINT_EMAIL:-dev@example.com}"
    ports:
      - "4321:4321" # Exposed for direct browser access if needed
    command: sh -c "npm install && rm -f .astro/dev.json && npm run dev -- --host 0.0.0.0"

  caddy:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
        PUBLIC_IMPRINT_NAME: "${PUBLIC_IMPRINT_NAME:-ZaaS Local Dev}"
        PUBLIC_IMPRINT_ADDRESS: "${PUBLIC_IMPRINT_ADDRESS:-Local Development Address}"
        PUBLIC_IMPRINT_EMAIL: "${PUBLIC_IMPRINT_EMAIL:-dev@example.com}"
    image: zaas-web:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.minimal:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ZAAS_DOMAIN: "${ZAAS_DOMAIN:-zaas.at}"
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
