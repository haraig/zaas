# Prometheus scrape configuration.
# Prometheus receives metrics from the OTel Collector via remote-write
# (pushed by the Collector). This config also scrapes the Collector's
# own internal metrics for self-monitoring.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus.rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Enable remote-write receiver (required for OTel Collector push).
# Started via --web.enable-remote-write-receiver CLI flag in docker-compose.yml.

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: /metrics

  - job_name: zaas-api
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: caddy
    scrape_interval: 15s
    static_configs:
      - targets: ["caddy:2019"]
    metrics_path: /metrics

  - job_name: postgres
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics

  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: /metrics

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9100"]
    metrics_path: /metrics
