version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # Go modules
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go

  # npm - web frontend
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
      - web
    ignore:
      # Astro check / @astrojs/language-server break on TypeScript 7 (https://github.com/withastro/astro/issues/17268).
      # Keep typescript on ^6 until Astro supports TS 7.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"

  # npm - root (commitlint)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # Docker - API
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  # Docker - web
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
