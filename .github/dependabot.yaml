version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # Go modules
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go

  # npm - web frontend
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
      - web

  # npm - root (commitlint)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # Docker - API
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  # Docker - web
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
